name: Stats

# Rebuilds the stat and language cards with scripts/build_stats.py and commits
# them back to main, but only when the rendered SVGs actually changed. See the
# token-scope note in assets/STYLE.md: the built-in GITHUB_TOKEN sees public
# repos only, so add a classic PAT as the PROFILE_TOKEN secret to count private
# work. The script reads GH_TOKEN first, so the fallback below picks it up.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Render cards
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/build_stats.py

      - name: Commit if the numbers moved
        run: |
          if git diff --quiet -- assets; then
            echo "cards unchanged, nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: refresh stat cards"
          git push
